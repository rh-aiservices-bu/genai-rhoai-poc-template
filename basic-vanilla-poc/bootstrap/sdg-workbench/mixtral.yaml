---
apiVersion: serving.kserve.io/v1alpha1
kind: ServingRuntime
metadata:
  annotations:
    opendatahub.io/accelerator-name: migrated-gpu
    opendatahub.io/apiProtocol: REST
    opendatahub.io/recommended-accelerators: '["nvidia.com/gpu"]'
    opendatahub.io/template-display-name: vLLM ServingRuntime for KServe
    opendatahub.io/template-name: vllm-runtime
    openshift.io/display-name: mixtral-8x7b
  labels:
    opendatahub.io/dashboard: "true"
  name: mixtral-8x7b
spec:
  annotations:
    prometheus.io/path: /metrics
    prometheus.io/port: "8080"
  multiModel: false
  supportedModelFormats:
    - autoSelect: true
      name: vLLM
  containers:
    - name: kserve-container
      image: quay.io/modh/vllm:rhoai-2.16-cuda
      command:
        - python
        - -m
        - vllm.entrypoints.openai.api_server
      args:
        - --port=8080
        - --model=/mnt/models
        - --served-model-name={{.Name}}
        - --dtype=float16
        - --tensor-parallel-size=4
      env:
        - name: HF_HOME
          value: /tmp/hf_home
      volumeMounts:
        - mountPath: /dev/shm
          name: shm
      ports:
        - containerPort: 8080
          protocol: TCP
  volumes:
    - emptyDir:
        medium: Memory
        sizeLimit: 2Gi
      name: shm
---
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  annotations:
    openshift.io/display-name: Mixtral 8x7b
    security.opendatahub.io/enable-auth: "true"
    serving.knative.openshift.io/enablePassthrough: "true"
    sidecar.istio.io/inject: "true"
    sidecar.istio.io/rewriteAppHTTPProbers: "true"
  labels:
    opendatahub.io/dashboard: "true"
  name: mixtral-8x7b
spec:
  predictor:
    annotations:
      serving.knative.dev/progress-deadline: 30m
      autoscaling.knative.dev/scale-to-zero-pod-retention-period: 5m
    maxReplicas: 1
    minReplicas: 0
    model:
      modelFormat:
        name: vLLM
      name: ""
      resources:
        limits:
          cpu: "32"
          memory: 128Gi
          nvidia.com/gpu: "4"
        requests:
          cpu: "16"
          memory: 64Gi
          nvidia.com/gpu: "4"
      runtime: mixtral-8x7b
      storageUri: oci://registry.redhat.io/rhelai1/modelcar-mixtral-8x7b-instruct-v0-1:latest
    tolerations:
      - effect: NoSchedule
        key: nvidia.com/gpu
        operator: Exists
