---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: deploy-sdg-workbench
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: deploy-sdg-workbench-namespace-edit
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: edit
subjects:
- kind: ServiceAccount
  name: deploy-sdg-workbench
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: deploy-sdg-workbench-route-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: route-reader
subjects:
- kind: ServiceAccount
  name: deploy-sdg-workbench
  namespace: demo
